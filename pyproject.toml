[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rappi-reconciliation"
version = "0.1.0"
description = "Data reconciliation utilities for Rappi vs third-party transactions"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Rappi Data Team"}]
dependencies = [
  "pandas>=1.5",
  "pyyaml>=6.0",
  "typer[all]>=0.9",
  "matplotlib>=3.6"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "ruff>=0.1.9",
  "mypy>=1.6"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "Q"]
exclude = ["notebooks"]

[tool.mypy]
python_version = "3.10"
disallow_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
